services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: medkids
      POSTGRES_PASSWORD: medkids
      POSTGRES_DB: medkids
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://medkids:medkids@db:5432/medkids
      SQL_ECHO: "false"
      ENV: local
      JWT_SECRET_KEY: dev-secret-change-me
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
