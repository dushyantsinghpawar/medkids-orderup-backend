name: backend-ci

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import os, time
          import psycopg2
          from urllib.parse import urlparse

          url = os.environ["DATABASE_URL"]
          u = urlparse(url)

          for i in range(30):
              try:
                  conn = psycopg2.connect(
                      dbname=u.path.lstrip("/"),
                      user=u.username,
                      password=u.password,
                      host=u.hostname,
                      port=u.port or 5432,
                  )
                  conn.close()
                  print("Postgres is ready")
                  break
              except Exception as e:
                  print(f"Waiting for Postgres... ({i+1}/30) {e}")
                  time.sleep(1)
          else:
              raise SystemExit("Postgres not ready after 30 seconds")
          PY

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Import test (sanity)
        run: |
          python -c "from app.main import app; print('app loaded')"
